
<a-scene 
    vr-mode-ui="enterVRButton: false; enterARButton: false;"
    style="width: 100%; height: 100%;"
    shadow="type: pcfsoft;"
    renderer="antialias: true;" effects="bloom"
    device-orientation-permission-ui="enabled: false"
>

    <a-assets>
        <!-- Replace this path with your texture file -->
        <img id="paperTex" src="/assets/textures/paper.png" crossorigin="anonymous">
        <img id="LpaperTex" src="/assets/textures/LINED_PAPER.jpg" crossorigin="anonymous">
    </a-assets>


    <a-sky color="#009FF6"></a-sky>

    <!-- Softer ambient so shadows stay visible -->
    <a-entity light="type: ambient; color: #FFFFFF; intensity: 0.25"></a-entity>

    <a-plane 
        position="0 0 -4"
        rotation="-90 0 0"
        width="7.5" height="7.5"
        color="#020202"
        shadow="receive: true">
    </a-plane>

    <a-box id="ground-1" position="0 0 0" rotation="0 0 0" color="#FFFFFF" width="10" height="0.5" depth="15" shadow="receive: true"></a-box>
    
    <a-entity id="rig" position="0 0 -10" rotation="0 0 0">
        <a-entity 
            id="isoCamera" 
            camera 
                        
    position="0 5 15"
    rotation="0 100 0"
            fov="40"
            far="10000"
            look-controls="enabled: true"
            wasd-controls="acceleration: 25"
            limited-look-controls="
                minPitch: -10; 
                maxPitch: 10; 
                minYaw: -10;
                maxYaw: 10"
            shadow="
                cast: true; 
                receive: false;"
        >
        </a-entity>
    </a-entity>

</a-scene>

<script>

    function randomHexColor() {
        return '#' + Math.floor(Math.random() * 0xFFFFFF).toString(16).padStart(6,'0');
    }

    // Random gray (#RRGGBB where R=G=B). Range 0–255; tweak min/max to avoid full black/white.
    function randomGrayColor(min = 32, max = 224) {
        const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
        const lo = clamp(min, 0, 255);
        const hi = clamp(max, 0, 255);
        const v = Math.floor(Math.random() * (hi - lo + 1)) + lo;
        const hex = v.toString(16).padStart(2, '0');
        return `#${hex}${hex}${hex}`;
    }

    function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
    }

    function randomOffset() {
        return Math.random().toFixed(2); // 0.00–0.99
    }
    function randomRotation() {
        // 0, 90, 180, 270 degrees in radians
        const steps = [0, Math.PI/2, Math.PI, 3*Math.PI/2];
        return steps[Math.floor(Math.random()*steps.length)];
    }    

    const groundEl = document.getElementById('ground-1');
    groundEl.setAttribute('color', randomGrayColor());

    const CLOUD_COUNT = 25;

    // Simple seeded random (for stable deformation if desired)
    function seededRand(seed) {
      let x = Math.sin(seed) * 10000;
      return x - Math.floor(x);
    }

    function createDeformedCloud(opts = {}) {
      const {
        x = 0, y = 8, z = 0,
        minPieces = 3,
        maxPieces = 7,
        baseSize = 0.25,
        spread = 0.6
      } = opts;

      const pieces = Math.floor(Math.random() * (maxPieces - minPieces + 1)) + minPieces;
      const cloudRoot = document.createElement('a-entity');
      cloudRoot.classList.add('cloud');
      cloudRoot.setAttribute('position', `${x} ${y} ${z}`);
      cloudRoot.setAttribute('cloud-drift', `speed:${randomInRange(0.15,0.9)}; jitter:0.15; minX:-5; maxX:5`);

      for (let i = 0; i < pieces; i++) {
        const seed = Math.random() * 9999;
        const px = (seededRand(seed + 1) - 0.5) * spread;
        const py = (seededRand(seed + 2) - 0.5) * (spread * 0.4);
        const pz = (seededRand(seed + 3) - 0.5) * spread;

        const sx = baseSize * (0.6 + seededRand(seed + 4));
        const sy = baseSize * (0.4 + seededRand(seed + 5));
        const sz = baseSize * (0.6 + seededRand(seed + 6));

        const box = document.createElement('a-box');
        box.setAttribute('position', `${px} ${py} ${pz}`);
        box.setAttribute('width', sx);
        box.setAttribute('height', sy);
        box.setAttribute('depth', sz);

        // Emissive subtle glow + paper texture (random offset)
        const offsetX = randomOffset();
        const offsetY = randomOffset();
        box.setAttribute('material',
          `shader: standard; src:#LpaperTex; color:#FFFFFF; emissive:#FFFFFF; emissiveIntensity:0.3; opacity:0.85; transparent:true; roughness:1; metalness:0; offset:${offsetX} ${offsetY}; repeat:2 2`);
        box.setAttribute('shadow', 'cast:false; receive:false');
box.setAttribute('random-deform', 'amp:0.02');
        cloudRoot.appendChild(box);
      }
      return cloudRoot;
    }

    function spawnClouds() {
      for (let i = 0; i < CLOUD_COUNT; i++) {
        scene.appendChild(createDeformedCloud({
          x: randomInRange(-5, 5),
          y: randomInRange(5, 6),
          z: randomInRange(-5, 5)
        }));
      }
    }



function spawnBirdFlock(opts = {}) {
  const {
    centerX = -5,
    centerY = 8,
    centerZ = -2,
    count   = Math.floor(Math.random()*3)+7, // 7–9 birds
    spacing = 0.55,
    depthSpacing = 0.45,
    heading = 25,        // yaw degrees (direction of travel)
    speed   = 1.2        // flock drift speed
  } = opts;

  const flock = document.createElement('a-entity');
  flock.id = 'bird-flock';
  flock.setAttribute('position', `${centerX} ${centerY} ${centerZ}`);
  flock.setAttribute('flock-drift', `speed:${speed}; minX:-10; maxX:10; heading:${heading}`);

  // Leader (index 0)
  const leader = createBird({
    x: 0, y: 0, z: 0,
    color: randomGrayColor()
  });
  leader.setAttribute('rotation', `0 ${heading} 0`);
  flock.appendChild(leader);

  // Remaining birds split into two arms
  let armIndex = 0;
  for (let i = 1; i < count; i++) {
    const left = i % 2 === 1; // alternate left/right
    if (!left) armIndex++;    // advance depth every right bird pair
    const step = armIndex + 1;
    const xOffset = (left ? -1 : 1) * step * spacing;
    const zOffset = -step * depthSpacing;
    const yOffset = (Math.random()-0.5)*0.25; // slight vertical variance

    const bird = createBird({
      x: xOffset,
      y: yOffset,
      z: zOffset,
      color: randomGrayColor()
    });
    bird.setAttribute('rotation', `0 ${heading} 0`);
    // Remove its individual bird-fly motion (V stays tight)
    bird.removeAttribute('bird-fly');
    flock.appendChild(bird);
  }

  scene.appendChild(flock);
}




   function createBird(opts = {}) {
  const {
    x = randomInRange(-5, 5),
    y = randomInRange(7, 11),
    z = randomInRange(-7, 0),
    color = randomGrayColor(),
    speed = randomInRange(0.8, 1.8) // units/sec
  } = opts;

  // Root entity (so the bird-fly behavior moves the whole V)
  const bird = document.createElement('a-entity');
  bird.classList.add('bird');
  bird.setAttribute('position', `${x} ${y} ${z}`);
  bird.setAttribute('bird-fly', `speed:${speed}; amp:${randomInRange(0.4,0.9)}; freq:${randomInRange(0.2,0.6)}; minX:-5; maxX:5; minZ:-7; maxZ:0; yMin:7; yMax:11`);

  // Wing dimensions (thin boxes)
  const wingThicknessX = 0.01; // X (thin)
  const wingHeightY    = 0.02; // Y (thin)
  const wingLengthZ    = 0.12; // Z (length)

  // Left wing (yaw +25°)
  const left = document.createElement('a-box');
  left.setAttribute('width', wingThicknessX);
  left.setAttribute('height', wingHeightY);
  left.setAttribute('depth', wingLengthZ);
  left.setAttribute('position', `-0.03 0 0`);
  left.setAttribute('rotation', `0 25 0`);
  left.setAttribute('material', `color:${color}; roughness:1; metalness:0`);
  left.setAttribute('shadow', 'cast:false; receive:false');

  // Right wing (yaw -25°)
  const right = document.createElement('a-box');
  right.setAttribute('width', wingThicknessX);
  right.setAttribute('height', wingHeightY);
  right.setAttribute('depth', wingLengthZ);
  right.setAttribute('position', `0.03 0 0`);
  right.setAttribute('rotation', `0 -25 0`);
  right.setAttribute('material', `color:${color}; roughness:1; metalness:0`);
  right.setAttribute('shadow', 'cast:false; receive:false');

  // Optional tiny body/joint
  const body = document.createElement('a-box');
  body.setAttribute('width', 0.012);
  body.setAttribute('height', 0.012);
  body.setAttribute('depth', 0.02);
  body.setAttribute('material', `color:${color}; roughness:1; metalness:0; opacity:0.9; transparent:true`);
  body.setAttribute('shadow', 'cast:false; receive:false');

  bird.appendChild(left);
  bird.appendChild(right);
  bird.appendChild(body);
  return bird;
}

    function spawnBirds() {
        const count = Math.floor(Math.random() * 4) + 8; // 3..5 birds
        for (let i = 0; i < count; i++) {
        scene.appendChild(createBird());
        }
    }

    // Create one box programmatically
    function createBuilding(opts = {}) {
        const {
            x = 0, y = 0, z = 0,
            w = 0.5, h = randomInRange(0.5, 6), d = 0.5,
            color = randomGrayColor(),
        } = opts;

        const repeatX = Math.max(1, Math.round(w * 3));
        const repeatY = Math.max(1, Math.round(h * 2));
        const offsetX = randomOffset();
        const offsetY = randomOffset();
        const rot = randomRotation();

        const building = document.createElement('a-box');
        building.setAttribute('position', `${x} ${y} ${z}`);
        building.setAttribute('width', w);
        building.setAttribute('height', h);
        building.setAttribute('depth', d);

        building.setAttribute(
            'material',
            `shader: standard; src: #LpaperTex; color: ${color}; roughness:1; metalness:0; repeat:${repeatX} ${repeatY}; offset:${offsetX} ${offsetY}; rotation:${rot}`
        );
        // Improve texture sampling when available
        building.addEventListener('materialtextureloaded', (e) => {
            const tex = e.detail.texture;
            if (tex) {
                tex.anisotropy = 8; // crisper at angles
                tex.needsUpdate = true;
            }
        });
        building.setAttribute('shadow', 'cast: true; receive: true');
        return building;
    }

    // Wait for scene to be ready
    const scene = document.querySelector('a-scene');
    scene.addEventListener('loaded', () => {
        // Spawn initial box
        // scene.appendChild(createBuilding({ x: 2, y: 8, z: -3 }));
    });

    // Optional: spawn a new random box every 3s (limit to 20)
    let spawned = 0;
    const MAX = 200;
    function spawnAllBuildings() {
        while (spawned < MAX) {
            scene.appendChild(
                createBuilding({
                x: randomInRange(-5, 5),
                y: randomInRange(-0.2, 0.4),
                z: randomInRange(-7, 0)
                })
            );
            spawned++;
        }
    }   
    scene.addEventListener('loaded', () => {

        const sun = document.createElement('a-entity');
        sun.id = 'featured-sphere';
        sun.setAttribute('geometry', 'primitive: sphere; radius: 0.6; segmentsWidth: 3; segmentsHeight: 3'); /* low poly */

        sun.setAttribute('shadow', 'cast: true; receive: false');
        sun.setAttribute('material', 'emissive: #FFD800; emissiveIntensity: 10.2; metalness:0; roughness:0.5');
        sun.setAttribute('orbit-motion', 'radius:14; speed:1.2; center:0 15 0');
        sun.setAttribute('self-spin', 'speed:120'); 
        scene.appendChild(sun);
    
        // Point light that FOLLOWS the box (instead of box following light)
        const followLight = document.createElement('a-entity');
        followLight.id = 'featured-light';
        followLight.setAttribute('light', 'type: directional; intensity: 1.5; distance: 5; decay: 2; color: #FFF7EB; castShadow: true; shadowMapWidth:1024; shadowMapHeight:1024; shadowCameraLeft:-5; shadowCameraRight:5; shadowCameraTop:5; shadowCameraBottom:-5; shadowCameraNear:0.5; shadowCameraFar:20;');
        followLight.setAttribute('shadow', 'castShadow: true');
        followLight.setAttribute('follow-target', 'target: #featured-sphere; offset: 0 0 0');
        scene.appendChild(followLight);

        spawnAllBuildings(); // create the boxes
        spawnClouds(); // add clouds
        spawnBirds(); // add birds
        spawnBirdFlock(); // NEW
    }); 

    // Orbit component
    AFRAME.registerComponent('orbit-motion', {
        schema: {
            radius: {default: 15},
            speed: {default: 1},  
            center: {type: 'vec3', default: {x:0,y:0,z:0}}
        },
        init() {
            this.angle = 0; // radians
        },
        tick(time, dt) {
            const deltaSec = dt / 100000; // correct
            this.angle += this.data.speed * 2 * Math.PI * deltaSec;
            const x = this.data.center.x + this.data.radius * Math.cos(this.angle);
            const z = this.data.center.z + this.data.radius * Math.sin(this.angle);
            this.el.setAttribute('position', `${x} ${this.data.center.y} ${z}`);
        }
    });

    // Make an entity follow another entity’s world position
    AFRAME.registerComponent('follow-target', {
    schema:{ target:{type:'selector'}, offset:{type:'vec3',default:{x:0,y:0,z:0}} },
    tick(){
        if(!this.data.target) return;
        const p = this.data.target.object3D.position;
        const o = this.data.offset;
        this.el.object3D.position.set(p.x+o.x, p.y+o.y, p.z+o.z);
    }
    });

    AFRAME.registerComponent('cloud-drift', {
        schema: {
            speed: {default: 0.5},
            jitter:{default: 0},
            minX:  {default: -5},
            maxX:  {default: 5}
        },
        init() {
            this._pos = new THREE.Vector3();
        },
        tick(time, dt) {
            const delta = dt / 5000;
            const variedSpeed = this.data.speed * (1 + (Math.random() - 0.5) * this.data.jitter);
            this.el.object3D.getWorldPosition(this._pos);
            this._pos.x += variedSpeed * delta;
            if (this._pos.x > this.data.maxX) this._pos.x = this.data.minX;
            this.el.object3D.position.set(this._pos.x, this._pos.y, this._pos.z);
        }
    });

    AFRAME.registerComponent('bird-fly', {
    schema: {
        speed:  {default: 1},
        minX:   {default: -5},
        maxX:   {default: 5},
        minZ:   {default: -7},
        maxZ:   {default: 0},
        yMin:   {default: 5},
        yMax:   {default: 9},
        amp:    {default: 0.6},    // vertical amplitude
        freq:   {default: 0.35}    // cycles per second
    },
    init() {
        this._target = new THREE.Vector3();
        this._phase  = Math.random() * Math.PI * 2;
        this._baseY  = this.el.object3D.position.y; // start height
        this.pickTarget();
    },
    pickTarget() {
        const d = this.data;
        this._target.set(
            randomInRange(d.minX, d.maxX),
            this._baseY, // keep horizontal target level; vertical handled by sine
            randomInRange(d.minZ, d.maxZ)
        );
    },
    tick(time, dt) {
        const delta = dt / 4000;
        if (delta <= 0) return;

        // Horizontal movement (ignore Y in distance calc)
        const pos = this.el.object3D.position;
        const to = this._target.clone().sub(pos);
        to.y = 0;
        const dist = Math.sqrt(to.x * to.x + to.z * to.z);

        if (dist < 0.05) {
            this.pickTarget();
            return;
        }

        to.normalize();
        const step = Math.min(dist, this.data.speed * delta);
        pos.x += to.x * step;
        pos.z += to.z * step;

        // Vertical oscillation
        this._phase += 2 * Math.PI * this.data.freq * delta;
        const yOsc = Math.sin(this._phase) * this.data.amp;
        pos.y = this._baseY + yOsc;

        // Face movement direction (yaw)
        const yaw = Math.atan2(to.x, to.z) * 180 / Math.PI;
        this.el.setAttribute('rotation', `0 ${yaw} 0`);
    }
    });

    AFRAME.registerComponent('self-spin', {
        schema:{ speed:{default:120} },
        init(){ this.angle=0; },
        tick(time, dt){
            const deltaSec = dt / 10000;
            this.angle = (this.angle + this.data.speed * deltaSec) % 360;
            this.el.setAttribute('rotation', `0 ${this.angle} 0`);
        }
    });

    AFRAME.registerComponent('random-deform', {
        schema:{ amp:{default:0.08} },
        init(){
            const apply = () => {
            const mesh = this.el.getObject3D('mesh');
            if (!mesh) return;
            const pos = mesh.geometry.attributes.position;
            for (let i=0;i<pos.count;i++){
                pos.setXYZ(
                i,
                pos.getX(i) + (Math.random()-0.5)*this.data.amp,
                pos.getY(i) + (Math.random()-0.5)*this.data.amp,
                pos.getZ(i) + (Math.random()-0.5)*this.data.amp
                );
            }
            pos.needsUpdate = true;
            mesh.geometry.computeVertexNormals();
            };
            this.el.addEventListener('object3dset', apply);
            apply();
        }
    });

    AFRAME.registerComponent('flock-drift', {
        schema: {
            speed: {default: 1},
            minX:  {default: -10},
            maxX:  {default: 10},
            heading:{default: 25} // degrees
        },
        init() {
            this._time = 0;
        },
        tick(time, dt) {
            const delta = dt / 1000;
            if (delta <= 0) return;
            this._time += delta;

            const p = this.el.object3D.position;

            // Move forward along heading
            const rad = this.data.heading * Math.PI/180;
            p.x += Math.sin(rad) * this.data.speed * delta;
            p.z += Math.cos(rad) * this.data.speed * delta;

            // Gentle vertical bob
            p.y += Math.sin(this._time * 2) * 0.01;

            // Wrap horizontally
            if (p.x > this.data.maxX) p.x = this.data.minX;
            if (p.x < this.data.minX) p.x = this.data.maxX;
        }
    });

    AFRAME.registerComponent('limited-look-controls', {
        schema: {
        minPitch: {default: -10}, // degrees
        maxPitch: {default: 10},
        minYaw: {default: -10},
        maxYaw: {default: 10}
        },
        tick: function () {
        var rotation = this.el.getAttribute('rotation');
        // Clamp pitch (x) and yaw (y)
        rotation.x = Math.max(this.data.minPitch, Math.min(this.data.maxPitch, rotation.x));
        rotation.y = Math.max(this.data.minYaw, Math.min(this.data.maxYaw, rotation.y));
        this.el.setAttribute('rotation', rotation);
        }
    });

    AFRAME.registerComponent('orthographic-camera', {
        schema: { size: {default: 4096}, near: {default: 0.1}, far: {default: 1000} },
        init() {
            this.camera = new THREE.OrthographicCamera();
            this.el.setObject3D('camera', this.camera);
            this._onResize = this.updateProjection.bind(this);
            window.addEventListener('resize', this._onResize);
            this.updateProjection();
        },
        updateProjection() {
            const size = this.data.size;
            const sceneEl = this.el.sceneEl;
            const canvas = sceneEl && sceneEl.canvas;
            const w = (canvas && canvas.clientWidth) || window.innerWidth || 1;
            const h = (canvas && canvas.clientHeight) || window.innerHeight || 1;
            const aspect = w / h;

            this.camera.left = -size * aspect * 2;
            this.camera.right =  size * aspect * 2;
            this.camera.top =   size * 2;
            this.camera.bottom = -size * 2;
            this.camera.near = this.data.near;
            this.camera.far = this.data.far;
            this.camera.updateProjectionMatrix();
        },
        remove() {
            window.removeEventListener('resize', this._onResize);
            this.el.removeObject3D('camera');
        }
    });


</script>
