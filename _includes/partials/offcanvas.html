<div class="offcanvas offcanvas-start bg-dark text-bg-dark" data-bs-backdrop="false" tabindex="-1" id="offCanvasMenu" aria-labelledby="offCanvasMenuLabel">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offCanvasMenuLabel">
            <div class="">
                <a id="header-brand-image" class="rounded-0" href="{% include mainurl.html %}/" title="{{ site.name }}">
                    {% include simages/head_logo.svg %}
                </a>
            </div>
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <div>
        <ul class="navbar-nav">
            {% for navitem in site.data.navigation.navigation_data %}
                <li class="nav-item">
                    <a id="{{ navitem.id }}-nav-link" class="nav-link nav-link text-light text-uppercase fs-5 fw-lighter" aria-current="page" href="{{ navitem.url }}" title="{{ navitem.title }}">{{ navitem.title }}</a>
                </li>
            {% endfor %}
        </ul>
      </div>
    </div>
  </div>
